# Gateway: serves the built SPA and proxies /api to the backend container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64M;

    # Autorise l'intégration en iframe depuis Navixy marque blanche (logitrak.fr),
    # Navixy NextGen, le hub Emergent et logitrak.ch. Bloque le clickjacking ailleurs.
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.logitrak.fr https://*.logitrak.ch https://*.navixy.com https://*.emergentagent.com" always;

    # API -> backend service on the isolated docker network
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
