name: logitrak-fleet

# Stack 100% isolé : conteneurs, réseau et volumes préfixés "logitrak-fleet_".
# Aucun partage avec vos autres apps (Navixy, dashboard, etc.).

services:
  mongo:
    image: mongo:7
    container_name: logitrak-fleet_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ../backend
    container_name: logitrak-fleet_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-logitrak_fleet}
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /data/storage
      ASTRA_DATA_DIR: /data/astra
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - storage_data:/data/storage
      - astra_data:/data/astra
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - internal

  web:
    build:
      context: ../frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-}
    container_name: logitrak-fleet_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8090}:80"
    depends_on:
      - backend
    networks:
      - internal

networks:
  internal:
    name: logitrak-fleet_net

volumes:
  mongo_data:
    name: logitrak-fleet_mongo_data
  storage_data:
    name: logitrak-fleet_storage_data
  astra_data:
    name: logitrak-fleet_astra_data
